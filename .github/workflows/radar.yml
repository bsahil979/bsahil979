name: Update Profile Metrics & Radar

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at midnight UTC
  workflow_dispatch:
  push:
    paths:
      - 'assets/*.json'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install Pillow numpy

      - name: Regenerate Banner
        run: python scripts/banner.py

      - name: Regenerate Skill Radar
        run: python scripts/radar.py --data assets/skills.json -o assets/radar

      - name: Regenerate Language Mix Radar
        run: python scripts/radar.py --data assets/langmix.json -o assets/radar-langs

      - name: Regenerate Stats and Project Cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/cards.py --user bsahil979 --out assets --projects assets/projects.json

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "chore(assets): automated refresh of radar charts and stats cards [skip ci]"
            git push
          fi
